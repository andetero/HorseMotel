name: Sync HorseMotel.com Listings

on:
  schedule:
    # Runs daily at 9a Mountain Time.
    - cron: "0 9 * * *"
      timezone: "America/Denver"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-horsemotel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Import and validate HorseMotel.com listings
        run: |
          set -euo pipefail
          rm -rf .sync-next
          mkdir -p .sync-next

          # Seed the candidate with the current feed so the importer can retain
          # existing IDs while it rebuilds the data.
          cp horsemotel.json .sync-next/horsemotel.next.json

          python scripts/import_horsemotel.py \
            --scrape-site \
            --site-url "https://www.horsemotel.com/" \
            --output .sync-next/horsemotel.next.json

          # Do not touch the published feed unless the rebuilt candidate passes
          # regression checks and corrected stable-ID matching.
          python scripts/validate_horsemotel.py \
            --current horsemotel.json \
            --candidate .sync-next/horsemotel.next.json \
            --dropped .sync-next/horsemotel_dropped.json

          mv .sync-next/horsemotel.next.json horsemotel.json
          mv .sync-next/horsemotel_dropped.json horsemotel_dropped.json
          rm -rf .sync-next

      - name: Commit output
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add horsemotel.json horsemotel_dropped.json

          if git diff --staged --quiet; then
            echo "No HorseMotel.com changes to commit."
            exit 0
          fi

          git commit -m "chore: sync HorseMotel.com listings"
          git push
