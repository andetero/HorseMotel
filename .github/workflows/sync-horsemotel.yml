name: Sync HorseMotel.com Listings

on:
  schedule:
    # Runs daily at 12:00 PM America/Denver.
    - cron: "0 12 * * *"
      timezone: "America/Denver"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-horsemotel:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Import authorized HorseMotel.com listings
        run: |
          set -euo pipefail

          run_import() {
            if [ -n "${{ secrets.HORSEMOTEL_SOURCE_URL }}" ]; then
              python scripts/import_horsemotel.py \
                --csv data/imports/horsemotel_listings.csv \
                --output horsemotel.json \
                --min-listings 700 \
                --max-growth-percent 50 \
                --download-kml \
                --source-url "${{ secrets.HORSEMOTEL_SOURCE_URL }}"
            else
              python scripts/import_horsemotel.py \
                --csv data/imports/horsemotel_listings.csv \
                --output horsemotel.json \
                --min-listings 700 \
                --max-growth-percent 50 \
                --download-kml \
                --scrape-site \
                --site-url "https://www.horsemotel.com/"
            fi
          }

          for attempt in 1 2 3; do
            echo "Import attempt ${attempt}..."
            if run_import; then
              echo "Import succeeded."
              exit 0
            fi

            echo "Import failed. Waiting before retry..."
            sleep $((attempt * 30))
          done

          echo "Import failed after retries."
          exit 1

      - name: Post-process duplicate HorseMotel.com listings
        run: |
          set -euo pipefail
          python scripts/postprocess_horsemotel_feed.py \
            --input horsemotel.json \
            --output horsemotel.json

      - name: Repair HorseMotel.com city values
        run: |
          set -euo pipefail
          python scripts/repair_horsemotel_cities.py \
            --input horsemotel.json \
            --output horsemotel.json

      - name: Upload HorseMotel.com sync outputs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: horsemotel-sync-outputs
          path: |
            horsemotel.json
            data/imports/horsemotel_map.kml

      - name: Commit outputs
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add horsemotel.json
          git add data/imports/horsemotel_map.kml
          git rm --ignore-unmatch horsemotel_listings.json feed_metadata.json scripts/generate_metadata.py scripts/validate_feed.py
          git rm --ignore-unmatch data/imports/horsemotel_schema_audit.md data/imports/horsemotel_import_report.md

          if git diff --staged --quiet; then
            echo "No HorseMotel.com changes to commit."
            exit 0
          fi

          git commit -m "chore: sync HorseMotel.com listings"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}..."
            if git push; then
              echo "Push succeeded."
              exit 0
            fi

            echo "Push failed. Waiting before retry..."
            sleep $((attempt * 30))
          done

          echo "Push failed after retries."
          exit 1
