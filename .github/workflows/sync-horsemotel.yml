name: Sync HorseMotel.com Listings

on:
  schedule:
    # Runs daily at 9p Mountain Time.
    - cron: "0 21 * * *"
      timezone: "America/Denver"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-horsemotel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Import HorseMotel.com listings
        run: |
          set -euo pipefail
          python scripts/import_horsemotel.py \
            --scrape-site \
            --site-url "https://www.horsemotel.com/" \
            --output horsemotel.json

      - name: Commit output
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add horsemotel.json

          if git diff --staged --quiet; then
            echo "No HorseMotel.com changes to commit."
            exit 0
          fi

          git commit -m "chore: sync HorseMotel.com listings"
          git push
